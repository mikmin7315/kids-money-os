<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#25273a" />
    <title>Monari</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f6f8;
        color: #17181c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 380px);
        padding: 28px;
        border: 1px solid rgba(23, 24, 28, 0.08);
        border-radius: 24px;
        background: #fff;
        text-align: center;
      }
      .mark {
        display: grid;
        width: 58px;
        height: 58px;
        margin: 0 auto 20px;
        place-items: center;
        border-radius: 18px;
        background: #25273a;
        color: white;
        font-size: 24px;
        font-weight: 800;
      }
      h1 { margin: 0; font-size: 21px; }
      p { margin: 10px 0 0; color: rgba(23, 24, 28, 0.58); line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">M</div>
      <h1>Monari 연결 준비 중</h1>
      <p>앱을 사용하려면 운영 서버 주소가 설정되어 있어야 합니다.</p>
    </main>
  </body>
</html>
