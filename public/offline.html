<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#25273a" />
    <title>오프라인 | Monari</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f6f8;
        color: #17181c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 380px);
        padding: 28px;
        border: 1px solid rgba(23, 24, 28, 0.08);
        border-radius: 24px;
        background: #fff;
        text-align: center;
        box-shadow: 0 12px 32px rgba(23, 24, 28, 0.08);
      }
      .mark {
        display: grid;
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        place-items: center;
        border-radius: 18px;
        background: #25273a;
        color: #fff;
        font-size: 24px;
        font-weight: 800;
      }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 10px 0 22px; color: rgba(23, 24, 28, 0.6); line-height: 1.6; }
      button {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 14px;
        background: #5146e5;
        color: #fff;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">M</div>
      <h1>인터넷 연결을 확인해주세요</h1>
      <p>가족 금융 기록을 안전하게 불러오려면 인터넷 연결이 필요합니다.</p>
      <button type="button" onclick="location.reload()">다시 연결하기</button>
    </main>
  </body>
</html>
